name: CareMate APK

on:
  push:
    paths: ["caremate/**", ".github/workflows/caremate-apk.yml"]
  pull_request:
    paths: ["caremate/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caremate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CareMate-apk
          path: caremate/app/build/outputs/apk/release/*.apk
